<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="svg-title svg-description"
>
  <title id="svg-title">How to Create a JSON File</title>
  <desc id="svg-description">
    A JsonToolBox beginner guide cover showing a Save As dialog writing data.json, with Windows, macOS, and Linux steps.
  </desc>

  <style>
    :root {
      --bg-color: #f8fafc;
      --line-color: #e2e8f0;
      --brace-color: #0284c7;
      --title-color: #0f172a;
      --subtitle-color: #475569;
      --code-color: #0369a1;
      --brand-color: #64748b;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --field-bg: #f1f5f9;
      --field-label: #475569;
      --field-value: #0f172a;
    }

    :root.dark {
      --bg-color: #0f172a;
      --line-color: #1e293b;
      --brace-color: #38bdf8;
      --title-color: #e2e8f0;
      --subtitle-color: #94a3b8;
      --code-color: #a5f3fc;
      --brand-color: #94a3b8;
      --card-bg: #111c33;
      --card-border: #1e293b;
      --field-bg: #1e293b;
      --field-label: #94a3b8;
      --field-value: #e2e8f0;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="var(--bg-color)" />

  <!-- Decorative code-like background lines -->
  <g fill="var(--line-color)" opacity="0.6">
    <rect x="72" y="60" width="196" height="14" rx="4" />
    <rect x="72" y="90" width="146" height="14" rx="4" />
    <rect x="72" y="120" width="180" height="14" rx="4" />

    <rect x="932" y="60" width="190" height="14" rx="4" />
    <rect x="978" y="90" width="144" height="14" rx="4" />
    <rect x="946" y="120" width="176" height="14" rx="4" />

    <rect x="120" y="524" width="154" height="10" rx="4" />
    <rect x="120" y="548" width="102" height="10" rx="4" />
    <rect x="950" y="524" width="146" height="10" rx="4" />
    <rect x="990" y="548" width="102" height="10" rx="4" />
  </g>

  <!-- Big JSON braces -->
  <text
    x="78"
    y="404"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="190"
    font-weight="600"
    fill="var(--brace-color)"
    opacity="0.18"
  >{</text>

  <text
    x="996"
    y="404"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="190"
    font-weight="600"
    fill="var(--brace-color)"
    opacity="0.18"
  >}</text>

  <!-- Eyebrow -->
  <text
    x="600"
    y="100"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="6"
    fill="#0284c7"
  >BEGINNER GUIDE</text>

  <!-- Title -->
  <text
    x="600"
    y="176"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="56"
    font-weight="750"
    fill="var(--title-color)"
  >How to Create a JSON File</text>

  <!-- Subtitle -->
  <text
    x="600"
    y="224"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="25"
    fill="var(--subtitle-color)"
  >Write it, save it as .json, validate it — on any operating system</text>

  <!-- Save As dialog card -->
  <g transform="translate(268 268)">
    <rect
      x="0"
      y="0"
      width="664"
      height="152"
      rx="20"
      fill="var(--card-bg)"
      stroke="var(--card-border)"
      stroke-width="2"
    />

    <!-- Dialog title bar -->
    <rect x="0" y="0" width="664" height="42" rx="20" fill="#0f172a" />
    <rect x="0" y="22" width="664" height="20" fill="#0f172a" />
    <circle cx="28" cy="21" r="5" fill="#f87171" />
    <circle cx="48" cy="21" r="5" fill="#fbbf24" />
    <circle cx="68" cy="21" r="5" fill="#34d399" />
    <text
      x="92"
      y="27"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
      font-size="15"
      font-weight="600"
      fill="#e2e8f0"
    >Save As</text>

    <!-- File name field -->
    <text
      x="28"
      y="78"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
      font-size="14"
      fill="var(--field-label)"
    >File name</text>
    <rect x="112" y="62" width="288" height="30" rx="8" fill="var(--field-bg)" stroke="#93c5fd" stroke-width="2" />
    <text
      x="128"
      y="83"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="17"
      font-weight="700"
      fill="var(--field-value)"
    >data.json</text>

    <!-- Save as type field -->
    <text
      x="424"
      y="78"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
      font-size="14"
      fill="var(--field-label)"
    >Save as type</text>
    <rect x="518" y="62" width="118" height="30" rx="8" fill="var(--field-bg)" stroke="var(--card-border)" stroke-width="2" />
    <text
      x="532"
      y="83"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
      font-size="14"
      fill="var(--field-value)"
    >All Files</text>

    <!-- Encoding + save button -->
    <text
      x="28"
      y="126"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
      font-size="14"
      fill="var(--field-label)"
    >Encoding</text>
    <rect x="112" y="110" width="118" height="30" rx="8" fill="var(--field-bg)" stroke="var(--card-border)" stroke-width="2" />
    <text
      x="126"
      y="131"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
      font-size="14"
      fill="var(--field-value)"
    >UTF-8</text>

    <rect x="530" y="110" width="106" height="30" rx="8" fill="#0284c7" />
    <text
      x="583"
      y="131"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
      font-size="14"
      font-weight="700"
      fill="#ffffff"
    >Save</text>
  </g>

  <!-- OS chips -->
  <g
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="18"
    font-weight="600"
  >
    <rect x="330" y="452" width="150" height="40" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <text x="405" y="478" text-anchor="middle" fill="#1d4ed8">Windows</text>

    <rect x="500" y="452" width="150" height="40" rx="20" fill="#ecfdf5" stroke="#86efac" stroke-width="2" />
    <text x="575" y="478" text-anchor="middle" fill="#15803d">macOS</text>

    <rect x="670" y="452" width="150" height="40" rx="20" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
    <text x="745" y="478" text-anchor="middle" fill="#b45309">Linux</text>
  </g>

  <!-- Brand / site name -->
  <text
    x="600"
    y="566"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="18"
    fill="var(--brand-color)"
  >JsonToolBox · Developer Guide</text>
</svg>
