<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="svg-title svg-description"
>
  <title id="svg-title">How to Create a manifest.json File</title>
  <desc id="svg-description">
    A JsonToolBox guide cover comparing a PWA web app manifest and a Chrome extension Manifest V3 manifest.json.
  </desc>

  <style>
    :root {
      --bg-color: #f8fafc;
      --line-color: #e2e8f0;
      --brace-color: #0284c7;
      --title-color: #0f172a;
      --subtitle-color: #475569;
      --brand-color: #64748b;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --key-color: #0369a1;
      --value-color: #0f172a;
      --muted-color: #94a3b8;
    }

    :root.dark {
      --bg-color: #0f172a;
      --line-color: #1e293b;
      --brace-color: #38bdf8;
      --title-color: #e2e8f0;
      --subtitle-color: #94a3b8;
      --brand-color: #94a3b8;
      --card-bg: #111c33;
      --card-border: #1e293b;
      --key-color: #7dd3fc;
      --value-color: #e2e8f0;
      --muted-color: #64748b;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="var(--bg-color)" />

  <!-- Decorative code-like background lines -->
  <g fill="var(--line-color)" opacity="0.6">
    <rect x="72" y="58" width="192" height="14" rx="4" />
    <rect x="72" y="88" width="142" height="14" rx="4" />
    <rect x="72" y="118" width="176" height="14" rx="4" />

    <rect x="936" y="58" width="188" height="14" rx="4" />
    <rect x="982" y="88" width="142" height="14" rx="4" />
    <rect x="950" y="118" width="174" height="14" rx="4" />

    <rect x="120" y="532" width="150" height="10" rx="4" />
    <rect x="120" y="556" width="100" height="10" rx="4" />
    <rect x="952" y="532" width="144" height="10" rx="4" />
    <rect x="992" y="556" width="100" height="10" rx="4" />
  </g>

  <!-- Big JSON braces -->
  <text
    x="76"
    y="408"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="190"
    font-weight="600"
    fill="var(--brace-color)"
    opacity="0.18"
  >{</text>

  <text
    x="998"
    y="408"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="190"
    font-weight="600"
    fill="var(--brace-color)"
    opacity="0.18"
  >}</text>

  <!-- Eyebrow -->
  <text
    x="600"
    y="98"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="6"
    fill="#0284c7"
  >MANIFEST.JSON GUIDE</text>

  <!-- Title -->
  <text
    x="600"
    y="172"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="54"
    font-weight="750"
    fill="var(--title-color)"
  >How to Create a manifest.json File</text>

  <!-- Subtitle -->
  <text
    x="600"
    y="220"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="25"
    fill="var(--subtitle-color)"
  >One filename, different specs: PWA and Chrome extension</text>

  <!-- PWA card -->
  <g transform="translate(96 268)">
    <rect x="0" y="0" width="464" height="230" rx="20" fill="var(--card-bg)" stroke="#93c5fd" stroke-width="2" />
    <rect x="0" y="0" width="464" height="44" rx="20" fill="#eff6ff" />
    <rect x="0" y="22" width="464" height="22" fill="#eff6ff" />
    <circle cx="28" cy="22" r="6" fill="#3b82f6" />
    <text
      x="46"
      y="28"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
      font-size="16"
      font-weight="700"
      fill="#1d4ed8"
    >PWA · Web App Manifest</text>
    <text
      x="438"
      y="28"
      text-anchor="end"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="13"
      fill="#64748b"
    >W3C</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text x="28" y="82" fill="var(--muted-color)">{</text>
      <text x="46" y="106"><tspan fill="var(--key-color)">"name"</tspan><tspan fill="var(--muted-color)">: </tspan><tspan fill="var(--value-color)">"JSON Toolbox"</tspan><tspan fill="var(--muted-color)">,</tspan></text>
      <text x="46" y="132"><tspan fill="var(--key-color)">"start_url"</tspan><tspan fill="var(--muted-color)">: </tspan><tspan fill="var(--value-color)">"/"</tspan><tspan fill="var(--muted-color)">,</tspan></text>
      <text x="46" y="158"><tspan fill="var(--key-color)">"display"</tspan><tspan fill="var(--muted-color)">: </tspan><tspan fill="var(--value-color)">"standalone"</tspan><tspan fill="var(--muted-color)">,</tspan></text>
      <text x="46" y="184"><tspan fill="var(--key-color)">"icons"</tspan><tspan fill="var(--muted-color)">: [192, 512]</tspan></text>
      <text x="28" y="210" fill="var(--muted-color)">}</text>
    </g>
  </g>

  <!-- Chrome extension card -->
  <g transform="translate(640 268)">
    <rect x="0" y="0" width="464" height="230" rx="20" fill="var(--card-bg)" stroke="#86efac" stroke-width="2" />
    <rect x="0" y="0" width="464" height="44" rx="20" fill="#ecfdf5" />
    <rect x="0" y="22" width="464" height="22" fill="#ecfdf5" />
    <circle cx="28" cy="22" r="6" fill="#22c55e" />
    <text
      x="46"
      y="28"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
      font-size="16"
      font-weight="700"
      fill="#15803d"
    >Chrome Extension · Manifest V3</text>
    <text
      x="438"
      y="28"
      text-anchor="end"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="13"
      fill="#64748b"
    >MV3</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text x="28" y="82" fill="var(--muted-color)">{</text>
      <text x="46" y="106"><tspan fill="var(--key-color)">"manifest_version"</tspan><tspan fill="var(--muted-color)">: </tspan><tspan fill="var(--value-color)">3</tspan><tspan fill="var(--muted-color)">,</tspan></text>
      <text x="46" y="132"><tspan fill="var(--key-color)">"name"</tspan><tspan fill="var(--muted-color)">: </tspan><tspan fill="var(--value-color)">"My Extension"</tspan><tspan fill="var(--muted-color)">,</tspan></text>
      <text x="46" y="158"><tspan fill="var(--key-color)">"background"</tspan><tspan fill="var(--muted-color)">: { </tspan><tspan fill="var(--value-color)">service_worker</tspan><tspan fill="var(--muted-color)"> }</tspan></text>
      <text x="46" y="184"><tspan fill="var(--key-color)">"host_permissions"</tspan><tspan fill="var(--muted-color)">: [...]</tspan></text>
      <text x="28" y="210" fill="var(--muted-color)">}</text>
    </g>
  </g>

  <!-- Required-fields strip -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600">
    <rect x="300" y="524" width="600" height="40" rx="20" fill="#f1f5f9" stroke="var(--card-border)" stroke-width="2" />
    <text x="600" y="550" text-anchor="middle" fill="#475569">Same JSON syntax · different required fields</text>
  </g>

  <!-- Brand / site name -->
  <text
    x="600"
    y="600"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="18"
    fill="var(--brand-color)"
  >JsonToolBox · Developer Guide</text>
</svg>
