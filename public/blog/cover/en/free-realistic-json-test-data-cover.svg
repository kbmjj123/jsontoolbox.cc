<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="svg-title svg-description"
>
  <title id="svg-title">Free Realistic JSON Test Data</title>
  <desc id="svg-description">
    A JsonToolBox cover for free realistic JSON test datasets: orders, users, logs, issues, payments, and products.
  </desc>

  <style>
    :root {
      --bg-color: #f8fafc;
      --line-color: #e2e8f0;
      --brace-color: #0284c7;
      --title-color: #0f172a;
      --subtitle-color: #475569;
      --code-color: #0369a1;
      --brand-color: #64748b;
      --chip-label: #0f172a;
    }

    :root.dark {
      --bg-color: #0f172a;
      --line-color: #1e293b;
      --brace-color: #38bdf8;
      --title-color: #e2e8f0;
      --subtitle-color: #94a3b8;
      --code-color: #a5f3fc;
      --brand-color: #94a3b8;
      --chip-label: #e2e8f0;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="var(--bg-color)" />

  <!-- Decorative code-like background lines -->
  <g fill="var(--line-color)" opacity="0.6">
    <rect x="80" y="64" width="200" height="14" rx="4" />
    <rect x="80" y="94" width="150" height="14" rx="4" />
    <rect x="80" y="124" width="184" height="14" rx="4" />

    <rect x="920" y="64" width="196" height="14" rx="4" />
    <rect x="968" y="94" width="148" height="14" rx="4" />
    <rect x="936" y="124" width="180" height="14" rx="4" />

    <rect x="120" y="520" width="158" height="10" rx="4" />
    <rect x="120" y="544" width="104" height="10" rx="4" />
    <rect x="948" y="520" width="150" height="10" rx="4" />
    <rect x="988" y="544" width="104" height="10" rx="4" />
  </g>

  <!-- Big JSON braces -->
  <text
    x="84"
    y="400"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="190"
    font-weight="600"
    fill="var(--brace-color)"
    opacity="0.18"
  >{</text>

  <text
    x="990"
    y="400"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="190"
    font-weight="600"
    fill="var(--brace-color)"
    opacity="0.18"
  >}</text>

  <!-- Eyebrow -->
  <text
    x="600"
    y="106"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="6"
    fill="#0284c7"
  >FREE TEST DATA</text>

  <!-- Title -->
  <text
    x="600"
    y="186"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="52"
    font-weight="750"
    fill="var(--title-color)"
  >Realistic JSON Test Data</text>

  <!-- Subtitle -->
  <text
    x="600"
    y="238"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="26"
    fill="var(--subtitle-color)"
  >Free datasets for JSON viewers, editors, and parsers</text>

  <!-- Dataset chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600">
    <!-- Row 1 -->
    <g transform="translate(240 288)">
      <rect x="0" y="0" width="220" height="60" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
      <circle cx="34" cy="30" r="8" fill="#3b82f6" />
      <text x="120" y="38" text-anchor="middle" fill="var(--chip-label)">orders</text>
    </g>
    <g transform="translate(490 288)">
      <rect x="0" y="0" width="220" height="60" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2" />
      <circle cx="34" cy="30" r="8" fill="#22c55e" />
      <text x="120" y="38" text-anchor="middle" fill="var(--chip-label)">users</text>
    </g>
    <g transform="translate(740 288)">
      <rect x="0" y="0" width="220" height="60" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
      <circle cx="34" cy="30" r="8" fill="#f59e0b" />
      <text x="120" y="38" text-anchor="middle" fill="var(--chip-label)">logs</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(240 364)">
      <rect x="0" y="0" width="220" height="60" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" />
      <circle cx="34" cy="30" r="8" fill="#8b5cf6" />
      <text x="120" y="38" text-anchor="middle" fill="var(--chip-label)">issues</text>
    </g>
    <g transform="translate(490 364)">
      <rect x="0" y="0" width="220" height="60" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="2" />
      <circle cx="34" cy="30" r="8" fill="#f43f5e" />
      <text x="120" y="38" text-anchor="middle" fill="var(--chip-label)">payments</text>
    </g>
    <g transform="translate(740 364)">
      <rect x="0" y="0" width="220" height="60" rx="16" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2" />
      <circle cx="34" cy="30" r="8" fill="#0ea5e9" />
      <text x="120" y="38" text-anchor="middle" fill="var(--chip-label)">products</text>
    </g>
  </g>

  <!-- Manifest code decoration -->
  <g
    fill="var(--code-color)"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="15"
    opacity="0.92"
  >
    <text x="600" y="484" text-anchor="middle">
      { "type": "orders", "file": "orders-10mb.json", "format": "pretty" }
    </text>
  </g>

  <!-- Brand / site name -->
  <text
    x="600"
    y="568"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
    font-size="18"
    fill="var(--brand-color)"
  >JsonToolBox · Developer Guide</text>
</svg>
