<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JSON 里能写注释吗？为什么不行，以及 4 种替代办法</title>
  <desc id="desc">JSONC 转 JSON 指南封面：标准 JSON 不支持注释，替换成 JSONC、JSON5 或注释键。</desc>

  <style>
    :root {
      --bg-color: #f8fafc;
      --line-color: #e2e8f0;
      --brace-color: #0284c7;
      --title-color: #0f172a;
      --subtitle-color: #475569;
      --code-color: #0369a1;
      --brand-color: #64748b;
      --strike-color: #dc2626;
    }
    :root.dark {
      --bg-color: #0f172a;
      --line-color: #1e293b;
      --brace-color: #38bdf8;
      --title-color: #e2e8f0;
      --subtitle-color: #94a3b8;
      --code-color: #a5f3fc;
      --brand-color: #64748b;
      --strike-color: #f87171;
    }
  </style>

  <rect width="1200" height="630" fill="var(--bg-color)"/>

  <g fill="var(--line-color)" opacity="0.6">
    <rect x="80" y="70" width="220" height="12" rx="4"/>
    <rect x="80" y="98" width="160" height="12" rx="4"/>
    <rect x="80" y="126" width="200" height="12" rx="4"/>

    <rect x="900" y="70" width="220" height="12" rx="4"/>
    <rect x="956" y="98" width="164" height="12" rx="4"/>
    <rect x="920" y="126" width="200" height="12" rx="4"/>

    <rect x="120" y="530" width="146" height="10" rx="4"/>
    <rect x="120" y="554" width="98" height="10" rx="4"/>
    <rect x="934" y="530" width="138" height="10" rx="4"/>
    <rect x="974" y="554" width="98" height="10" rx="4"/>
  </g>

  <text x="96" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="170" fill="var(--brace-color)" opacity="0.22">{</text>
  <text x="1010" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="170" fill="var(--brace-color)" opacity="0.22">}</text>

  <text x="600" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="var(--strike-color)" opacity="0.9">// 这一行</text>
  <line x1="500" y1="192" x2="700" y2="192" stroke="var(--strike-color)" stroke-width="3" opacity="0.8"/>

  <text x="600" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="var(--title-color)">JSON 里能写注释吗？</text>

  <text x="600" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="var(--subtitle-color)">不能。以及 4 种能用的替代办法</text>

  <g fill="var(--code-color)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" opacity="0.95">
    <text x="600" y="430" text-anchor="middle">SyntaxError: Unexpected token '/' in JSON at position 4</text>
    <text x="600" y="460" text-anchor="middle">JSONC · JSON5 · HJSON · _comment 键</text>
  </g>

  <text x="600" y="560" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="var(--brand-color)">JsonToolBox · 开发者指南</text>
</svg>
