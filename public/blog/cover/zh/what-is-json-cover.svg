<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      /* 浅色模式（默认） */
      --bg-color: #f8fafc;
      --line-color: #e2e8f0;
      --brace-color: #0284c7;
      --title-color: #0f172a;
      --subtitle-color: #475569;
      --code-color: #0369a1;
      --brand-color: #64748b;
    }

    :root.dark {
      /* 深色模式 */
      --bg-color: #0f172a;
      --line-color: #1e293b;
      --brace-color: #38bdf8;
      --title-color: #e2e8f0;
      --subtitle-color: #94a3b8;
      --code-color: #a5f3fc;
      --brand-color: #64748b;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="var(--bg-color)"/>

  <!-- Decorative code-like background lines -->
  <g fill="var(--line-color)" opacity="0.6">
    <rect x="80" y="80" width="220" height="14" rx="4"/>
    <rect x="80" y="110" width="160" height="14" rx="4"/>
    <rect x="80" y="140" width="200" height="14" rx="4"/>
    <rect x="80" y="170" width="140" height="14" rx="4"/>

    <rect x="400" y="80" width="180" height="14" rx="4"/>
    <rect x="400" y="110" width="220" height="14" rx="4"/>
    <rect x="400" y="140" width="160" height="14" rx="4"/>

    <rect x="720" y="80" width="200" height="14" rx="4"/>
    <rect x="720" y="110" width="140" height="14" rx="4"/>
    <rect x="720" y="140" width="180" height="14" rx="4"/>
    <rect x="720" y="170" width="220" height="14" rx="4"/>
  </g>

  <!-- Big JSON braces -->
  <text x="100" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="160" fill="var(--brace-color)" opacity="0.25">{</text>
  <text x="980" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="160" fill="var(--brace-color)" opacity="0.25">}</text>

  <!-- Main title -->
  <text x="600" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="var(--title-color)">
    What Is JSON?
  </text>

  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="var(--subtitle-color)">
    Structure, Syntax &amp; Common Mistakes
  </text>

  <!-- Small code snippet decoration -->
  <g fill="var(--code-color)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" opacity="0.9">
    <text x="600" y="420" text-anchor="middle">"key": "value",</text>
    <text x="600" y="450" text-anchor="middle">"number": 42,</text>
    <text x="600" y="480" text-anchor="middle">"active": true</text>
  </g>

  <!-- Brand / site name -->
  <text x="600" y="560" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="var(--brand-color)">
    JsonToolBox · Developer Guide
  </text>
</svg>