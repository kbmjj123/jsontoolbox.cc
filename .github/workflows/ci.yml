name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  site:
    name: 'jsontoolbox site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The standalone `@kbmjj123/json-editor` repo carries its own CI now.
      # Site tests live in `tests/**` and no longer reference the workspace.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
