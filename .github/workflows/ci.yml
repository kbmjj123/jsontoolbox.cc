name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  json-editor:
    name: '@kbmjj123/json-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Only the package and its workspace deps — the Nuxt site is not needed
      # to typecheck, test or build this package.
      # pnpm-lock.yaml is tracked, so this install is reproducible; keep it in
      # sync with the site build (Cloudflare Pages uses --frozen-lockfile).
      - run: pnpm install --filter @kbmjj123/json-editor...

      - run: pnpm --filter @kbmjj123/json-editor run typecheck
      - run: pnpm --filter @kbmjj123/json-editor run test
      - run: pnpm --filter @kbmjj123/json-editor run build
