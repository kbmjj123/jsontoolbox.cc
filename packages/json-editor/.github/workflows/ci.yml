# CI for the standalone `@kbmjj123/json-editor` repository
# (https://github.com/kbmjj123/json-editor).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The standalone repo must commit its own pnpm-lock.yaml when it is
      # created; this workflow expects that lock to be present.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
