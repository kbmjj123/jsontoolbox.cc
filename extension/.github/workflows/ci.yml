# CI for the standalone browser-extension repository
# (https://github.com/kbmjj123/json-browser-plugins).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The standalone repo must commit its own pnpm-lock.yaml on creation.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
